<h1>曜语 YaoLang 教程 04: 函数与递归</h1>
<p>定义: 函数 add(a:整数, b:整数):整数 { 返回 a + b }<br>
递归: 函数 fib(n:整数):整数 {<br>
  若 n <= 1 { 返回 n }<br>
  返回 fib(n-1) + fib(n-2)<br>
}<br>
入口: 函数 主函数() { _yao_print(fib(10)) }</p>
