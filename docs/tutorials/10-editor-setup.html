<h1>曜语 YaoLang 教程 10: 编辑器使用教程</h1>
<p>Android上使用曜语:<br>
  1. 安装 Operit 或 Termux<br>
  2. 编译: cc -O2 -o yaoc yaolang.c -lm<br>
  3. 编写: nano hello.耀<br>
  4. 编译: ./yaoc hello.耀<br>
  5. 运行: ./hello<br>
下载: github.com/a737812/yaolang/releases</p>
