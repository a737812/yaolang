<h1>曜语 YaoLang 教程 09: 编译器内部原理</h1>
<p>架构: .耀 -> 词法 -> 语法 -> 语义 -> C代码 -> gcc -> 可执行文件<br>
编译器: yaolang.c 约3700行C代码<br>
词法: UTF-8源码 -> Token序列 (关键字/标识符/字面量/运算符)<br>
语法: Token -> AST (抽象语法树)<br>
语义: 类型检查 + 作用域管理<br>
代码生成: AST -> C代码 (中文标识符 -> Unicode C标识符)<br>
自举: test/yao_lexer.耀 可以解析自身源文件</p>
